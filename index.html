<!-- Ruangan Muat Naik Gambar Ukuran Pasport (Ditambah dalam Tab Maklumat Asas) -->
<div class="mb-6 bg-gray-50 p-4 rounded-lg border border-gray-200">
  <label class="block text-sm font-semibold text-gray-700 mb-2">
    <i class="fas fa-camera mr-2 text-blue-600"></i>Gambar Ukuran Pasport Murid
  </label>
  <div class="flex items-center space-x-4">
    <!-- Kotak Pratonton Gambar -->
    <div id="passport-preview-container" class="w-28 h-36 border-2 border-dashed border-gray-300 rounded-lg flex items-center justify-center bg-white overflow-hidden relative shadow-sm">
      <img id="passport-preview" src="" alt="Gambar Pasport Murid" class="hidden w-full h-full object-cover">
      <div id="passport-placeholder" class="text-center p-2">
        <i class="fas fa-user-circle text-gray-300 text-4xl mb-1"></i>
        <p class="text-xs text-gray-400 font-medium">Gambar Pasport</p>
      </div>
    </div>

    <!-- Butang & Input Muat Naik -->
    <div class="flex-1">
      <input type="file" id="gambarPasportInput" accept="image/*" onchange="previewPassportPhoto(event)" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-gray-300 rounded-md p-1">
      <p class="text-xs text-gray-500 mt-2"><i class="fas fa-info-circle mr-1"></i>Format yang disokong: JPG, PNG, WEBP (Saiz maks: 2MB)</p>
      
      <button type="button" id="btnPadamGambarPasport" onclick="removePassportPhoto()" class="hidden mt-3 text-xs bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 px-3 py-1.5 rounded-md font-medium transition-colors">
        <i class="fas fa-trash-alt mr-1"></i> Padam Gambar
      </button>
    </div>
  </div>
</div>
